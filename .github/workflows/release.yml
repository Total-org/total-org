# Build the macOS + Windows apps and publish them to GitHub Releases for one version tag.
# Two ways in:
#   - a v* tag pushed by hand (npm version patch && git push --follow-tags) — the push trigger;
#   - the scheduled release (scheduled-release.yml) CALLS this workflow with `tag`, because a tag
#     pushed with GITHUB_TOKEN never triggers other workflows.
# electron-updater in the app reads these releases to auto-update installed copies.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: The v* tag to build and publish (already pushed)
        required: true
        type: string
    secrets:
      # Audit A4: the Ed25519 key that signs total-manifest.json. The caller MUST pass it by name
      # (scheduled-release does): GitHub then resolves it in the sign job's environment
      # (production-release), whose value wins over a repository secret of the same name, and an
      # environment secret that is not passed reads as empty in a called workflow. Readiness review
      # SEC2-1: the owner moves the key into that environment and deletes the repository secret;
      # this works before and after. With no key the signing step fails and the release stays a draft.
      RELEASE_MANIFEST_KEY:
        required: false
  # Re-run a release whose build failed after its tag was pushed (Actions → Release → Run workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: The v* tag to build and publish (already pushed)
        required: true
        type: string

env:
  # The tag being released: the caller's input, else the pushed tag.
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      # Readiness review SEC2-4: no token on disk while npm ci, the tests and electron-builder run;
      # GH_TOKEN reaches only the steps that create / upload to the release.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Electron binary + electron-builder's tools from the Actions cache, not GitHub's
      # release downloads (502/504 on 8 Nov). A re-run of a tag cut before the action existed
      # skips it and downloads as before.
      - if: hashFiles('.github/actions/electron-binary/action.yml') != ''
        uses: ./.github/actions/electron-binary
        with:
          packaging: 'true'

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Hermetic IPC smoke test against the build
        run: npm run smoke
        env:
          TOTAL_DATA_DIR: ${{ runner.temp }}/total-data
          SMOKE_OUT: ${{ runner.temp }}/smoke

      - name: Ensure the release exists (one per tag)
        # One release per tag, created here; both build jobs only upload into it with `gh` (electron-
        # builder's own publishing raced to create it and made two releases on v0.3.0 / v0.2.0).
        # Created as a DRAFT and published only after the Windows files are up (last step of
        # sign-and-publish, after release-win), so /releases/latest never points at a release without its assets.
        # Notes = the version's CHANGELOG section when the tree has the script (scheduled releases).
        # A PUBLISHED release is never rebuilt (review of #292): its files would be replaced before
        # anyone approved a new signing, and its signed manifest would no longer match them. A re-run
        # finishes a draft only.
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo none)
          if [ "$state" = false ]; then echo "::error::$TAG is already published; a published release is never rebuilt"; exit 1; fi
          if [ "$state" = true ]; then echo "$TAG is a draft: finishing it"; exit 0; fi
          if [ -f scripts/release/gate.mjs ]; then node scripts/release/gate.mjs notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"; else echo "Release notes to follow." > "$RUNNER_TEMP/notes.md"; fi
          gh release create "$TAG" --draft --title "Total ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SEC2-4: electron-builder runs without a token (--publish never); the files are uploaded by
      # the step after the checks. It still writes latest-mac.yml and the blockmaps (publish config).
      - name: Build DMG + ZIP (no publish)
        run: npx electron-builder --mac --publish never
        env:
          DEBUG: '@electron/get:index'
          # Unsigned beta builds: users right-click → Open on first launch, and the
          # in-app updater falls back to a "download the new version" prompt.
          # When you have an Apple Developer ID, add CSC_LINK + CSC_KEY_PASSWORD
          # secrets here and auto-update becomes fully silent (to-do.md §3, SEC3-1).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Audit 2026-11 A2: the DMG / ZIP were built with the fuses package.json sets, and the ad-hoc
      # re-sign after flipping them left a valid signature (an arm64 Mac refuses to start a binary
      # whose signature is broken). Checked BEFORE anything is uploaded.
      - name: Electron fuses + signature + contents of the packaged build
        run: |
          app="$(ls -d dist/mac*/Total.app | head -1)"
          node scripts/fuses.mjs check "$app/Contents/MacOS/Total"
          codesign --verify --deep --strict "$app"
          # Audit 2 SEC2-3: the shipped build refuses --remote-debugging-port / -pipe.
          node scripts/debug-switch-check.mjs "$app/Contents/MacOS/Total"
          # Readiness review SEC3-3: no type-check output (build paths, source file names) in the app.
          node scripts/release/asar-check.mjs "$app/Contents/Resources/app.asar"

      # Readiness review SEC3-7: 1.0 is Apple silicon only — exactly the arm64 files, by name (a
      # missing one fails here), and latest-mac.yml must name that zip. The release is still a draft.
      - name: Upload DMG + ZIP to the release
        run: |
          v="${TAG#v}"
          grep -q "^path: Total-$v-arm64-mac.zip$" dist/latest-mac.yml || { echo "latest-mac.yml does not name Total-$v-arm64-mac.zip"; cat dist/latest-mac.yml; exit 1; }
          gh release upload "$TAG" "dist/Total-$v-arm64.dmg" "dist/Total-$v-arm64.dmg.blockmap" "dist/Total-$v-arm64-mac.zip" "dist/Total-$v-arm64-mac.zip.blockmap" dist/latest-mac.yml --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-win:
    # Runs after the mac job so both publish into the SAME release —
    # parallel jobs each create their own release for the tag (learned the hard way).
    needs: release-mac
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Readiness review SEC2-4: no token on disk while npm ci, the tests and electron-builder run;
      # GH_TOKEN reaches only the steps that create / upload to the release.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Electron binary + electron-builder's tools from the Actions cache, not GitHub's
      # release downloads (502/504 on 8 Nov). A re-run of a tag cut before the action existed
      # skips it and downloads as before.
      - if: hashFiles('.github/actions/electron-binary/action.yml') != ''
        uses: ./.github/actions/electron-binary
        with:
          packaging: 'true'

      - name: Run tests
        run: npm test

      - name: Renderer tests (jsdom + RTL)
        run: npm run test:renderer

      - name: DB-layer tests (Electron-as-Node)
        run: npm run test:db

      - name: Build NSIS installer (no publish — electron-builder creates a DUPLICATE
          release for the tag even when one exists; observed on v0.2.0)
        run: npm run build && npx electron-builder --win --publish never
        env:
          DEBUG: '@electron/get:index'

      # WP 7.3: electron-updater downloads the file latest.yml names, so the uploaded asset must
      # carry exactly that name (0.11.0 shipped "Total Setup 0.11.0.exe" — GitHub stored it as
      # Total.Setup.0.11.0.exe while latest.yml asked for Total-Setup-0.11.0.exe).
      - name: latest.yml names the installer exactly
        shell: bash
        run: |
          exe=$(cd dist && ls *.exe | head -1)
          case "$exe" in *" "*) echo "installer name has a space: $exe"; exit 1;; esac
          grep -q "^path: $exe$" dist/latest.yml || { echo "latest.yml does not name $exe"; cat dist/latest.yml; exit 1; }

      # Audit 2026-11 A2: the shipped build has its Electron fuses set (no RunAsNode / NODE_OPTIONS /
      # --inspect, asar integrity, app only from app.asar). Playwright needs --inspect, so the smoke
      # runs on a copy that differs only in that one fuse (scripts/fuses.mjs).
      - name: Electron fuses of the packaged build + a smoke copy
        shell: bash
        run: |
          node scripts/fuses.mjs check dist/win-unpacked/Total.exe
          node scripts/debug-switch-check.mjs dist/win-unpacked/Total.exe
          node scripts/release/asar-check.mjs dist/win-unpacked/resources/app.asar
          node scripts/fuses.mjs test-copy dist/win-unpacked/Total.exe

      - name: Hermetic IPC smoke test against the packaged Total.exe
        run: npm run smoke
        env:
          TOTAL_APP_EXECUTABLE: ${{ github.workspace }}\dist\win-unpacked-smoke\Total.exe
          TOTAL_DATA_DIR: ${{ runner.temp }}\Total packaged data
          SMOKE_OUT: ${{ runner.temp }}\smoke-packaged

      - name: Upload installer to the existing release
        shell: bash
        # Still a draft? This job can be re-run on its own (review of #292: never replace the files
        # of a published release).
        run: |
          state=$(gh release view "${TAG}" --json isDraft --jq .isDraft --repo "${GITHUB_REPOSITORY}")
          if [ "$state" != true ]; then echo "::error::${TAG} is not a draft; a published release is never rebuilt"; exit 1; fi
          gh release upload "${TAG}" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Audit A4 (SEC-5): the app offers a version only when this release's total-manifest.json
  # (SHA-256 + SHA-512 of every asset, Ed25519-signed with the RELEASE_MANIFEST_KEY secret) verifies
  # against the key pinned in src/main/releaseKeys.json. Signed in a job of its own (review of #251):
  # no `npm ci`, no tests, no electron-builder ran on this runner, so no third-party package code
  # shares a machine with the key; it signs the files as GitHub now holds them, checks them back, and
  # only then publishes.
  # Readiness review SEC2-1 / SEC3-6:
  #   - environment production-release: the owner is its required reviewer and it deploys only from
  #     main and v* tags, so EVERY release (a scheduled slot's too) waits here for the owner's click,
  #     and a run on any other branch never reaches the key. The scheduled gate reads that wait as a
  #     quiet "waiting for approval" (scripts/release/lib.mjs releaseBuildState).
  #   - the scripts are the TAG's (the code being released), not the workflow's ref.
  #   - signing is not optional: no key, no script or a failed check = the job fails and the release
  #     stays a draft; publishing runs only after the signed manifest is confirmed on the release.
  #     (A tag cut before A4 has no script and can no longer be published this way.)
  sign-and-publish:
    needs: release-win
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            src/main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign the release manifest
        run: |
          dir="$RUNNER_TEMP/release-assets"
          rm -rf "$dir" && mkdir -p "$dir"
          gh release download "${TAG}" --dir "$dir" --repo "${GITHUB_REPOSITORY}"
          rm -f "$dir/total-manifest.json"
          node scripts/release/manifest.mjs sign "$dir" "${TAG#v}" "$RUNNER_TEMP/total-manifest.json"
          node scripts/release/manifest.mjs check "$RUNNER_TEMP/total-manifest.json" "${TAG#v}" "$dir"
          gh release upload "${TAG}" "$RUNNER_TEMP/total-manifest.json" --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MANIFEST_KEY: ${{ secrets.RELEASE_MANIFEST_KEY }}

      - name: Publish the release (only with the manifest just signed on it; never left as a draft)
        run: |
          gh release download "${TAG}" --pattern total-manifest.json --output "$RUNNER_TEMP/published-manifest.json" --repo "${GITHUB_REPOSITORY}"
          cmp "$RUNNER_TEMP/total-manifest.json" "$RUNNER_TEMP/published-manifest.json"
          gh release edit "${TAG}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
